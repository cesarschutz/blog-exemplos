# A opção encryptionKeyFile do artigo: a chave num arquivo local, no mesmo servidor dos dados.
# Segundo a MongoDB, não atende à maioria das exigências regulatórias de gestão de chaves; em produção,
# prefira o KMIP (mongod-kmip.conf). Serve aqui porque o teste não tem um servidor KMIP.
net:
  port: 27017
  bindIp: 0.0.0.0
security:
  enableEncryption: true
  encryptionKeyFile: /etc/mongodb/chave/mongodb-keyfile
