# O bloco do artigo ("MongoDB fora do Atlas", em trânsito). Só o bindIp muda: dentro do container,
# o mongod escuta em todas as interfaces (no artigo, 127.0.0.1,10.0.1.15).
net:
  port: 27017
  bindIp: 0.0.0.0
  tls:
    mode: requireTLS
    certificateKeyFile: /etc/mongodb/tls/mongod.pem   # certificado + chave privada
    CAFile: /etc/mongodb/tls/ca.pem
    # clientes sem certificado autenticam com usuário e senha (security.authorization ligado)
    allowConnectionsWithoutCertificates: true
    disabledProtocols: TLS1_0,TLS1_1
