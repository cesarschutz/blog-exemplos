# O bloco do artigo (Enterprise, em repouso): a chave mestra vem de um servidor KMIP, o recomendado.
# O teste usa o mongod-arquivo-de-chave.conf, que não precisa de servidor KMIP.
security:
  enableEncryption: true
  kmip:
    serverName: kmip.interno
    port: 5696
    serverCAFile: /etc/mongodb/kmip/ca.pem
    clientCertificateFile: /etc/mongodb/kmip/mongod-client.pem
